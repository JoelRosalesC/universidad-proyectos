<!DOCTYPE html>
<html
  lang="en"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <title></title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta24/dist/css/tabler.min.css"
    />
    <style>
      .hover-underline:hover {
        text-decoration: underline !important;
      }
      @media (max-width: 600px) {
        .sm-w-full {
          width: 100% !important;
        }
        .sm-px-24 {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
        .sm-py-32 {
          padding-top: 32px !important;
          padding-bottom: 32px !important;
        }
        .sm-leading-32 {
          line-height: 32px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      width: 100%;
      padding: 0;
      word-break: break-word;
      -webkit-font-smoothing: antialiased;
      background-color: #eceff1;
    "
  >
    <div style="mso-line-height-rule: exactly; display: none"></div>
    <div
      role="article"
      aria-roledescription="email"
      aria-label="Default email title"
      lang="en"
      style="mso-line-height-rule: exactly"
    >
      <table
        style="
          width: 100%;
          font-family: Montserrat, -apple-system, 'Segoe UI', sans-serif;
        "
        cellpadding="0"
        cellspacing="0"
        role="presentation"
      >
        <tr>
          <td
            align="center"
            style="
              mso-line-height-rule: exactly;
              background-color: #eceff1;
              font-family: Montserrat, -apple-system, 'Segoe UI', sans-serif;
            "
          >
            <table
              class="sm-w-full"
              style="width: 600px"
              cellpadding="0"
              cellspacing="0"
              role="presentation"
            >
              <tr>
                <td
                  class="sm-py-24 sm-px-24"
                  style="
                    background-color: #fb923c;
                    mso-line-height-rule: exactly;
                    padding: 28px;
                    text-align: center;
                    font-family: Montserrat, -apple-system, 'Segoe UI',
                      sans-serif;
                  "
                ></td>
              </tr>
              <tr>
                <td
                  align="center"
                  class="sm-px-24"
                  style="mso-line-height-rule: exactly"
                >
                  <table
                    style="width: 100%"
                    cellpadding="0"
                    cellspacing="0"
                    role="presentation"
                  >
                    <tr>
                      <td
                        class="sm-px-24"
                        style="
                          mso-line-height-rule: exactly;
                          border-radius: 4px;
                          background-color: #ffffff;
                          padding: 40px;
                          text-align: left;
                          font-family: Montserrat, -apple-system, 'Segoe UI',
                            sans-serif;
                          font-size: 16px;
                          line-height: 24px;
                          color: #626262;
                        "
                      >
                        <p
                          style="
                            mso-line-height-rule: exactly;
                            margin-bottom: 24px;
                            font-size: 20px;
                            font-weight: 600;
                          "
                        >
                        ¡Hola!
                        </p>
                        <p
                          style="
                            mso-line-height-rule: exactly;
                            margin: 0;
                            margin-top: 24px;
                            margin-bottom: 24px;
                          "
                        >
                        Su código de validación es el siguiente:
                        </p>
                        <div
                        style="
                          background-color: hsl(41, 100%, 95%);
                          padding: 10px;
                          border-radius: 5px;
                          font-size: 20px;
                          font-weight: bold;
                          text-align: center;
                          color: #fb923c;
                        "
                      >
                        {code}
                      </div>
                        <p
                          style="
                            mso-line-height-rule: exactly;
                            margin: 0;
                            margin-top: 24px;
                            margin-bottom: 24px;
                          "
                        >
                        Si no lo solicitó, ignore este correo electrónico.
                        </p>
                        <table
                          style="width: 100%"
                          cellpadding="0"
                          cellspacing="0"
                          role="presentation"
                        >
                          <tr>
                            <td
                              style="
                                mso-line-height-rule: exactly;
                                padding-top: 32px;
                                padding-bottom: 32px;
                              "
                            >
                              <div
                                style="
                                  mso-line-height-rule: exactly;
                                  height: 1px;
                                  background-color: #eceff1;
                                  line-height: 1px;
                                "
                              >
                                &zwnj;
                              </div>
                            </td>
                          </tr>
                        </table>
                        <b> Alquila Car </b>
                        <div>
                          Soporte:
                          <a
                            href="mailto:alquilacar.notificaciones@gmail.com"
                            style="margin-left: 5px"
                            >alquilacar.notificaciones@gmail.com</a
                          >
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td
                        style="mso-line-height-rule: exactly; height: 20px"
                      ></td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta24/dist/js/tabler.min.js"></script>
  </body>
</html>
